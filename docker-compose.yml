version: '3.8'

services:
  postgres:
    image: postgis/postgis:15-3.3
    container_name: land_records_db
    environment:
      POSTGRES_DB: land_records
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgrespassword
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: land_records_redis
    ports:
      - "6379:6379"

  backend:
    build:
      context: .
      dockerfile: docker/Dockerfile.backend
    container_name: land_records_backend
    environment:
      - DATABASE_URL=postgresql+asyncpg://postgres:postgrespassword@postgres:5432/land_records
      - MAX_FILE_SIZE_MB=25
      - SECRET_KEY=super-secret-key-change-in-production-land-record-digitization-2026
    ports:
      - "8000:8000"
    volumes:
      - ./storage:/app/storage
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started

  worker:
    build:
      context: .
      dockerfile: docker/Dockerfile.backend
    container_name: land_records_worker
    command: uvicorn app.main:app --host 0.0.0.0 --port 8001
    environment:
      - DATABASE_URL=postgresql+asyncpg://postgres:postgrespassword@postgres:5432/land_records
    volumes:
      - ./storage:/app/storage
    depends_on:
      - backend

  frontend:
    build:
      context: .
      dockerfile: docker/Dockerfile.frontend
    container_name: land_records_frontend
    ports:
      - "3000:80"
    depends_on:
      - backend

volumes:
  postgres_data:
